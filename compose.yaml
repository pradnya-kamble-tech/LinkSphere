
services:
  db:
    image: postgres:16
    container_name: linksphere-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linksphere_db}
      POSTGRES_USER: ${POSTGRES_USER:-linksphere_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linksphere_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - linksphere_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linksphere_user} -d ${POSTGRES_DB:-linksphere_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  linksphere_postgres_data:
